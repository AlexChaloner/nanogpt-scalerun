name: Leaderboard site

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scalerun-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Render the committed season, or the synthetic demo before one exists
        shell: bash
        run: |
          mkdir -p site
          if [[ -f season/contest.json && -f season/state.json ]]; then
            results=()
            [[ -d season/results ]] && results=(--results season/results)
            scalerun leaderboard --config season/contest.json --state season/state.json "${results[@]}" \
              --output site/leaderboard.json --html site/index.html
          else
            scalerun demo --output demo
            cp demo/leaderboard.html site/index.html
            cp demo/leaderboard.json site/leaderboard.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
