name: Weekly promotion proposal

on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalerun-weekly-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Build promotion proposal from reviewed result files
        shell: bash
        run: |
          if [[ ! -f season/contest.json || ! -f season/state.json ]]; then
            echo 'Create season/contest.json and season/state.json after calibration to enable weekly proposals.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/propose_week.py --season season --output proposal
          cat proposal/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('proposal/state.json') != '' }}
        with:
          name: scalerun-weekly-promotion
          path: proposal/
          retention-days: 90
