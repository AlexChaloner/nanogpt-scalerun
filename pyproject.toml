[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt-scalerun"
version = "0.1.0"
description = "A multi-scale language-model benchmark with minimax scoring and weekly successive promotion."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NanoGPT ScaleRun contributors"}]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.4,<3"]
data = ["tiktoken>=0.7,<1", "pyarrow>=14"]

[project.scripts]
scalerun = "scalerun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
